<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <title>Oblihub</title>
    <script>
      // FOUC guard: set data-theme from localStorage BEFORE React boots so the first paint
      // matches the user's saved theme. STORAGE_KEY must stay in sync with utils/theme.ts.
      try {
        var t = localStorage.getItem('oh-theme');
        if (t === 'obli-operator' || t === 'obli-daylight' || t === 'obli-dim' || t === 'modern' || t === 'neon') {
          document.documentElement.dataset.theme = t;
        } else {
          document.documentElement.dataset.theme = 'obli-operator';
        }
      } catch (e) {
        document.documentElement.dataset.theme = 'obli-operator';
      }
    </script>
    <style>
      /* Pre-Tailwind body bg for light theme so the initial paint isn't dark
         while stylesheets are still loading. */
      [data-theme="obli-daylight"] body { background: #e5e9f0; }
      /* Same for Obli Dim (slate page) so the first paint isn't near-black. */
      [data-theme="obli-dim"] body { background: #2e3440; }
    </style>
  </head>
  <body class="bg-bg-primary text-text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
